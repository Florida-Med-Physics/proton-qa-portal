services:
  portal:
    build: .
    restart: unless-stopped
    environment:
      PORTAL_ORIGIN: https://${PORTAL_DOMAIN:?Set PORTAL_DOMAIN}
      PROTON_QA_DB: /data/portal.db
      PORTAL_BIND_HOST: 0.0.0.0
    volumes:
      - portal_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set PORTAL_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      portal:
        condition: service_healthy
volumes:
  portal_data:
  caddy_data:
  caddy_config:
